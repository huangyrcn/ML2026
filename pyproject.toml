    "scrapy>=2.14.1",
    "requests>=2.32",
    "lxml>=5.3",
    # 实验二 & 三：特征选择 / 特征提取
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    # 通用
    "pandas>=2.2",
    "openpyxl>=3.1",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]
